<div class="container" style="padding-top: 30px">
    	<div class="row">
			<div class="col-md-6 col-md-offset-3">
				<div class="panel panel-login">
					<div class="panel-body">
						<div class="row">
							<div class="col-lg-12">
                                <!-- Login form -->
                                <form id="addnewproduct-form" #addnewproductForm="ngForm" (ngSubmit)="AddNewProductUser(addnewproductForm.value)" role="form" style="display: block;">
                                    <div class="form-group">
										<input type="text" name="productname" ngModel id="productname" tabindex="1" class="form-control" placeholder="Product Name" >
									</div>
									<div class="form-group">
										<input type="text" name="producttype" ngModel id="producttype" tabindex="1" class="form-control" placeholder="Product Type">
									</div>
                                    <div class="form-group">
										<input type="text" name="productgroup" ngModel id="productgroup" tabindex="1" class="form-control" placeholder="Product Group">
									</div>
                                    <div class="form-group">
										<input type="text" name="productbrand" ngModel id="productbrand" tabindex="1" class="form-control" placeholder="Product Brand">
									</div>
                                    <div class="form-group">
										<input type="text" name="productprice" ngModel id="productprice" tabindex="1" class="form-control" placeholder="Product Price">
									</div>
                                    <div class="form-group">
										<input type="text" name="productpricerange" ngModel id="productpricerange" tabindex="1" class="form-control" placeholder="Product Price Range">
									</div>
                                    <div class="form-group">
										<input type="text" name="productcolor" ngModel id="productcolor" tabindex="1" class="form-control" placeholder="Product Color">
									</div>
                                    <div class="form-group">
										<input type="text" name="productimage" ngModel id="productimage" tabindex="1" class="form-control" placeholder="Product Image">
									</div>

                                    <div class="form-group">
                                        <div class="row">
                                            <div class="col-sm-6 col-sm-offset-3">
                                                <button type="submit" name="addnewproduct-submit" id="addnewproduct-submit" tabindex="4" class="form-control btn btn-register">Add to Database</button>
                                            </div>
                                        <!-- <a href="/" id="LoginButtonLink" style="text-decoration: none;visibility: hidden;"></a> -->
                                        </div>
                                    </div>
                            </form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
