<!-- 1. Search bar and Navigation bar in header page. -->

<header class="header-container">
  <div class="header-left">
    <img src="../../../../assets/img/IconBnC_Removed.png" alt="Logo" class="logo">
  </div>
  <div class="header-center">
    <form class="search-form" action="/action_page.php">
      <input type="text" placeholder="Search your product..." name="search" class="search-input" [(ngModel)]="searchTerm" (input)="onSearch()">
      <button type="submit" class="search-btn"><i class="fa fa-search"></i></button>
    </form>
  </div>
  <div class="header-right">
    <!-- <button class="header-btn"><a class="header-btn "href="payment_handling">Bag and Payment</a></button> -->
    <button class="header-btn" (click)="MoveToPaymentPage()">Bag and Payment</button>
    <button class="header-btn" (click)="AddNewProductForAdminRight()" *ngIf="isAdminRightValid">Add new product</button>
    <button class="header-btn" (click)="ManageOrderAdminRight()" *ngIf="isAdminRightValid">Manage Order</button>
    <button class="header-btn user-btn" (click)="LogOut()">
      <i class="fa fa-user"></i> {{Identified_Current_User}}
    </button>
  </div>
  <div 
      id="AddedIntoBag_showing" 
      class="modal_for_addedIntoBag"
      [ngStyle]="{'display': isCheckShoppingBagVisible === true ? 'block' : 'none'}"
  >
      <p style="font-size: 20px">You should login before payment!</p>
      <button 
          
          id="Login_now"
          (click) ="Login_now()"
      >Login now</button>
      <button 
       
          id="Login_later"
          (click) ="Login_later()"
      >Login later</button>
  </div>
</header>
